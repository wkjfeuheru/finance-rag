name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyjwt>=2.8.0 pytest>=8.0.0 pytest-asyncio>=0.24.0

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: |
          python -m py_compile config/settings.py
          python -m py_compile finance_rag/src/utils/logger.py
          python -m py_compile finance_rag/src/infrastructure/vector_store/hybrid_retriever.py
          python -m py_compile finance_rag/src/infrastructure/vector_store/milvus_kb.py
          python -m py_compile finance_rag/src/infrastructure/vector_store/chunker.py
          python -m py_compile finance_rag/src/infrastructure/vector_store/onnx_embedder.py
          python -m py_compile finance_rag/src/application/chat_service.py
          python -m py_compile finance_rag/src/main.py
          python -m py_compile finance_rag/src/utils/audit.py
          python -m py_compile finance_rag/src/utils/metrics.py
          python -m py_compile finance_rag/src/api/dependencies.py
          python -m py_compile finance_rag/src/application/langgraph_service.py
          echo "All syntax checks passed"