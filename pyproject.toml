[project]
name = "finance-rag"
version = "3.0.0"
description = "金融 Agentic RAG 知识库检索平台"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.0",
    "numpy>=2.0",
    "oss2>=2.18.6",
    "mineru==3.4.5",
    "ftfy>=6.3.1",
    "langchain>=1.2.0",
    "langchain-core>=1.2.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=0.2.0",
    "pymilvus>=2.4.0",
    "pymupdf>=1.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "langchain-deepseek",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.7.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "optimum>=1.20",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "pyjwt>=2.8.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
eval = [
    "ragas==0.4.3",
    "datasets>=4.0.0",
    "llama-index>=0.11",
    "llama-index-readers-file>=0.1",
    "llama-parse>=0.5",
]

[project.scripts]
finance-rag = "finance_rag.src.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
