[project]
name = "finance-rag"
version = "3.0.0"
description = "金融 Agentic RAG 知识库检索平台"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.0",
    "numpy>=2.0",
    "langchain>=1.2.0",
    "langchain-core>=1.2.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=0.2.0",
    "pymilvus>=2.4.0",
    "langchain-deepseek",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.7.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "optimum>=1.20",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "pyjwt>=2.8.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
eval = [
    "ragas==0.4.3",
    "datasets>=4.0.0",
    "llama-index>=0.11",
    "llama-index-readers-file>=0.1",
    "llama-parse>=0.5",
]

[project.scripts]
finance-rag = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
