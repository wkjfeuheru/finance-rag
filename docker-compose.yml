version: "3.9"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_rag}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    # 必须 >= 2.5：本服务的稀疏检索用 Milvus 原生 BM25 Function
    # （全文检索自 2.5 引入），且环境里的 pymilvus 为 3.0.0。
    # 原 pin v2.4.0 会让 create_collection 的 add_function 直接失败。
    image: milvusdb/milvus:v2.6.17
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      MILVUS_URI: ${MILVUS_URI:?MILVUS_URI is required}
      MILVUS_TIMEOUT_SECONDS: "30"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_DB: ${POSTGRES_DB:-finance_rag}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REDIS_CACHE_PREFIX: finance_rag
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_REGION: ${OSS_REGION}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek:deepseek-v4-pro}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ADMIN_USERNAME: ${JWT_ADMIN_USERNAME:-admin}
      JWT_ADMIN_PASSWORD: ${JWT_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      MODEL_CACHE_DIR: /app/onnx_cache/models
      MODEL_OFFLINE: "true"
      HF_HUB_OFFLINE: "true"
      TRANSFORMERS_OFFLINE: "true"
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-25}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # HF 模型缓存（嵌入 + reranker）纳入持久卷，避免容器重建后重新下载
      HF_HOME: /app/onnx_cache/hf_home
      ONNX_CACHE_DIR: /app/onnx_cache
      MILVUS_FINGERPRINT_PATH: /app/assets/state/.milvus_fingerprint
      UPLOAD_DIR: /app/files
    volumes:
      - app_onnx_cache:/app/onnx_cache
      - app_state:/app/assets/state
      - app_files:/app/files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  etcd_data:
  milvus_data:
  postgres_data:
  redis_data:
  app_onnx_cache:
  app_state:
  app_files:
